# Builds, tests (without the game's data, whose tests are skipped) and publishes one native
# executable and SDL3's library per platform, and the Android APK; a v* tag also makes a GitHub
# release of them.
#
#   windows-latest ─► mdk-win-x64.zip      (DXIL + SPIR-V)
#   ubuntu-latest  ─► mdk-linux-x64.tar.gz (SPIR-V)          ─► release (tags v*)
#   ubuntu-24.04-arm ─► mdk-linux-arm64.tar.gz (linux-x64's SPIR-V: no dxc for ARM)
#   macos-latest   ─► mdk-osx-arm64.zip    (SPIR-V + MSL)
#   ubuntu-latest  ─► mdk-android.apk      (SPIR-V; Vulkan)
name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_VERSION: 10.0.x
  # DirectXShaderCompiler release: dxc with DXIL (signed) and SPIR-V, for Windows and Linux.
  DXC_TAG: v1.9.2609
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            shaders: dxil spirv
          - os: ubuntu-latest
            rid: linux-x64
            shaders: spirv
          - os: macos-latest
            rid: osx-arm64
            shaders: spirv msl
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Shader tools, passed to the build as MSBuild properties (src/Mdk.Engine/Mdk.Engine.csproj).
      - name: Shader tools (Windows)
        if: runner.os == 'Windows'
        run: |
          gh release download "$DXC_TAG" -R microsoft/DirectXShaderCompiler -p 'dxc_2*.zip' -D "$RUNNER_TEMP"
          7z x -bd -o"$RUNNER_TEMP/dxc" "$RUNNER_TEMP"/dxc_2*.zip > /dev/null
          DXC=$(cygpath -w "$RUNNER_TEMP/dxc/bin/x64/dxc.exe")
          echo "SHADER_TOOLS=-p:Dxc=$DXC -p:DxcSpirv=$DXC" >> "$GITHUB_ENV"

      - name: Shader tools (Linux)
        if: runner.os == 'Linux'
        run: |
          gh release download "$DXC_TAG" -R microsoft/DirectXShaderCompiler -p 'linux_dxc_*.tar.gz' -D "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/dxc"
          tar -xzf "$RUNNER_TEMP"/linux_dxc_*.tar.gz -C "$RUNNER_TEMP/dxc"
          echo "SHADER_TOOLS=-p:DxcSpirv=$RUNNER_TEMP/dxc/bin/dxc" >> "$GITHUB_ENV"

      # No dxc release for macOS: the Vulkan SDK has dxc and spirv-cross.
      - name: Shader tools (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/vulkan.zip" https://sdk.lunarg.com/sdk/download/latest/mac/vulkan_sdk.zip
          unzip -q "$RUNNER_TEMP/vulkan.zip" -d "$RUNNER_TEMP/vulkan"
          INSTALLER=$(find "$RUNNER_TEMP/vulkan" -path '*.app/Contents/MacOS/*' -type f | head -n 1)
          sudo "$INSTALLER" --root "$HOME/VulkanSDK" --accept-licenses --default-answer --confirm-command install
          DXC=$(find "$HOME/VulkanSDK" -path '*/bin/dxc' | head -n 1)
          SPIRV_CROSS=$(find "$HOME/VulkanSDK" -path '*/bin/spirv-cross' | head -n 1)
          echo "SHADER_TOOLS=-p:DxcSpirv=$DXC -p:SpirvCross=$SPIRV_CROSS" >> "$GITHUB_ENV"

      - name: Test
        run: dotnet test $SHADER_TOOLS "-p:RequiredShaders=${{ matrix.shaders }}"

      - name: Publish
        run: sh tools/publish.sh ${{ matrix.rid }} $SHADER_TOOLS "-p:RequiredShaders=${{ matrix.shaders }}"

      # The native executable starts; without the game it stops there (no GPU on the runners).
      - name: Smoke test
        run: |
          OUT=$(./publish/mdk_sdl --mute 2>&1 || true)
          echo "$OUT"
          echo "$OUT" | grep -q "MDK data not found"
          ./publish/mdk_sdl --help | grep -q "Usage: mdk_sdl"

      # The OS's HTTP library (WinHTTP, libcurl) fetches the upscaler's release: TLS, GitHub's
      # redirect, the expected SHA-256.
      - name: Download test
        run: |
          OUT=$(./publish/mdk_sdl --download-test="$UPSCALER_URL" 2>&1 || true)
          echo "$OUT"
          echo "$OUT" | grep -q "SHA-256 $UPSCALER_SHA256"
        env:
          UPSCALER_URL: https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-ubuntu.zip
          UPSCALER_SHA256: e5aa6eb131234b87c0c51f82b89390f5e3e642b7b70f2b9bbe95b6a285a40c96

      - name: Archive
        run: |
          mkdir dist
          if [ "$RUNNER_OS" = Windows ]; then
            7z a -tzip "dist/mdk-${{ matrix.rid }}.zip" ./publish/mdk_sdl.exe ./publish/SDL3.dll
          elif [ "$RUNNER_OS" = Linux ]; then
            tar -czf "dist/mdk-${{ matrix.rid }}.tar.gz" -C publish mdk_sdl libSDL3.so -C ../assets icon.png
          else
            (cd publish && zip -q "../dist/mdk-${{ matrix.rid }}.zip" mdk_sdl libSDL3.dylib)
            zip -qj "dist/mdk-${{ matrix.rid }}.zip" assets/icon.png
          fi
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: mdk-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

      # SPIR-V is the same on any CPU: the ARM build takes these.
      - uses: actions/upload-artifact@v7
        if: matrix.rid == 'linux-x64'
        with:
          name: shaders-spirv
          path: src/Mdk.Engine/obj/shaders/*.spv
          if-no-files-found: error

  # Linux on ARM64 (Raspberry Pi 5, ARM handhelds). No dxc release runs there: the shaders are
  # linux-x64's (PrecompiledShaders, src/Mdk.Engine/Mdk.Engine.csproj).
  linux-arm64:
    needs: build
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/download-artifact@v8
        with:
          name: shaders-spirv
          path: src/Mdk.Engine/obj/shaders

      # Native AOT links with clang and zlib.
      - name: Linker
        run: sudo apt-get install -y -qq clang zlib1g-dev

      - name: Test
        run: dotnet test -p:PrecompiledShaders=spirv -p:RequiredShaders=spirv

      - name: Publish
        run: sh tools/publish.sh linux-arm64 -p:PrecompiledShaders=spirv -p:RequiredShaders=spirv

      - name: Smoke test
        run: |
          OUT=$(./publish/mdk_sdl --mute 2>&1 || true)
          echo "$OUT"
          echo "$OUT" | grep -q "MDK data not found"
          ./publish/mdk_sdl --help | grep -q "Usage: mdk_sdl"

      - name: Archive
        run: |
          mkdir dist
          tar -czf dist/mdk-linux-arm64.tar.gz -C publish mdk_sdl libSDL3.so -C ../assets icon.png
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: mdk-linux-arm64
          path: dist/*
          if-no-files-found: error

  # The Android app (src/Mdk.Android): arm64 and x64 in one APK, with All files access (plays
  # the MDK folder in place); -p:StoreBuild=true would leave it out (files always copied, for a
  # store). Signed with the ANDROID_KEYSTORE secrets when they're set (updates install over each
  # other), else with a debug key made for this run.
  android:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # The Android workload builds with JDK 21.
      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: "21"

      - name: Shader tools
        run: |
          gh release download "$DXC_TAG" -R microsoft/DirectXShaderCompiler -p 'linux_dxc_*.tar.gz' -D "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/dxc"
          tar -xzf "$RUNNER_TEMP"/linux_dxc_*.tar.gz -C "$RUNNER_TEMP/dxc"
          echo "SHADER_TOOLS=-p:DxcSpirv=$RUNNER_TEMP/dxc/bin/dxc" >> "$GITHUB_ENV"

      - name: Android workload
        run: |
          dotnet workload install android
          dotnet build src/Mdk.Android -t:InstallAndroidDependencies -f net10.0-android             "-p:AndroidSdkDirectory=$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=True

      - name: Signing key
        if: env.ANDROID_KEYSTORE != ''
        run: |
          echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "SIGNING=-p:AndroidKeyStore=true -p:AndroidSigningKeyStore=$RUNNER_TEMP/release.keystore -p:AndroidSigningKeyAlias=$ANDROID_KEY_ALIAS -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASS -p:AndroidSigningKeyPass=env:ANDROID_KEYSTORE_PASS" >> "$GITHUB_ENV"

      # NativeAOT links with the runner's default NDK (r27; ANDROID_NDK_HOME): r30 fails.
      - name: Publish
        run: |
          dotnet publish src/Mdk.Android -c Release "-p:AndroidSdkDirectory=$ANDROID_HOME" "-p:AndroidNdkDirectory=$ANDROID_NDK_HOME"             $SHADER_TOOLS -p:RequiredShaders=spirv $SIGNING
          mkdir dist
          cp src/Mdk.Android/bin/Release/net10.0-android/publish/*-Signed.apk dist/mdk-android.apk
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: mdk-android
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, linux-arm64, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: mdk-*
          merge-multiple: true

      # A tag with a suffix (v0.9.0-alpha) is a prerelease.
      - name: Release
        run: |
          PRE=$(case "$GITHUB_REF_NAME" in *-*) echo --prerelease;; esac)
          gh release create "$GITHUB_REF_NAME" dist/* -R "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes $PRE
